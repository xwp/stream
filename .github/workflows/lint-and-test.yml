name: Lint and Test

on: [push, workflow_call]

env:
  # Opt into Node.js 24 for JavaScript actions that still ship a Node 20 runtime.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:

  lint:
    name: Lint and Test (PHP ${{ matrix.php }})
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      # PHPUnit 11 cannot run on PHP 7.4. The runtime minimum is checked
      # by the php74-syntax job and by PHPCompatibility testVersion 7.4-.
      matrix:
        php: ['8.2', '8.3', '8.4']
    env:
      # wp-env reads this instead of a custom WordPress image tag.
      WP_ENV_PHP_VERSION: ${{ matrix.php }}
    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-php-${{ matrix.php }}-${{ hashFiles( 'composer.lock' ) }}
          restore-keys: ${{ runner.os }}-php-${{ matrix.php }}-

      - name: Install NPM dependencies
        run: npm install

      - name: Install Composer dependencies
        run: composer install

      - name: Check Composer platform requirements
        run: composer check-platform-reqs

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Start wp-env
        run: npx wp-env start

      - name: Confirm container PHP version
        run: npm run which-php

      - name: Test
        run: npm run test

  e2e:
    name: E2E (PHP ${{ matrix.php }})
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    needs: lint
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
    env:
      WP_ENV_PHP_VERSION: ${{ matrix.php }}
    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-php-${{ matrix.php }}-${{ hashFiles( 'composer.lock' ) }}
          restore-keys: ${{ runner.os }}-php-${{ matrix.php }}-

      - name: Install NPM dependencies
        run: npm install

      - name: Install Composer dependencies
        run: composer install

      - name: Check Composer platform requirements
        run: composer check-platform-reqs

      - name: Refresh apt metadata
        # `shivammathur/setup-php` adds the ondrej/php PPA, which recently
        # changed its repository `Label`. `apt-get update` (invoked by
        # Playwright's `--with-deps`) aborts with exit code 100 on such
        # changes unless `--allow-releaseinfo-change` is passed. Refresh the
        # metadata here so the subsequent Playwright dependency install works.
        run: sudo apt-get update --allow-releaseinfo-change

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      - name: Start wp-env
        run: npx wp-env start

      - name: Confirm container PHP version
        run: npm run which-php

      - name: Run E2E tests
        run: npm run test-e2e

      - name: Dump wp-env logs on failure
        if: failure()
        run: |
          npx wp-env logs || true
          npx wp-env logs tests || true

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-php-${{ matrix.php }}
          path: playwright-report
          retention-days: 7

  # Syntax-only. PHPUnit 11 cannot run on 7.4, so this job does not
  # composer install or execute tests. PHPCompatibility against 7.4 runs
  # on the Lint and Test matrix via phpcs.xml.dist testVersion 7.4-.
  php74-syntax:
    name: PHP 7.4 syntax
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'

      - name: Parse production PHP files
        run: find . \( -path './vendor' -o -path './tests' -o -path './node_modules' \) -prune -o -name '*.php' -print0 | xargs -0 -n1 php -l
