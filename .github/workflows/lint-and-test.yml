name: Lint and Test

on: [push, workflow_call]

env:
  # Opt into Node.js 24 for JavaScript actions that still ship a Node 20 runtime.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  # PHPUnit 11 needs PHP ≥ 8.2. Pin the wordpress image until ghcr latest is rebuilt.
  WORDPRESS_IMAGE_VERSION: php8.2

jobs:

  lint:
    name: Lint and Test
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-php-${{ hashFiles( 'composer.lock' ) }}
          restore-keys: ${{ runner.os }}-php-

      - name: Install NPM dependencies
        run: npm install

      - name: Install Composer dependencies
        run: composer install

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Start wp-env
        run: npx wp-env start

      - name: Test
        run: npm run test

  e2e:
    name: E2E
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    needs: lint
    permissions:
      contents: read
      packages: read
    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-php-${{ hashFiles( 'composer.lock' ) }}
          restore-keys: ${{ runner.os }}-php-

      - name: Install NPM dependencies
        run: npm install

      - name: Install Composer dependencies
        run: composer install

      - name: Refresh apt metadata
        # `shivammathur/setup-php` adds the ondrej/php PPA, which recently
        # changed its repository `Label`. `apt-get update` (invoked by
        # Playwright's `--with-deps`) aborts with exit code 100 on such
        # changes unless `--allow-releaseinfo-change` is passed. Refresh the
        # metadata here so the subsequent Playwright dependency install works.
        run: sudo apt-get update --allow-releaseinfo-change

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      - name: Start wp-env
        run: npx wp-env start

      - name: Run E2E tests
        run: npm run test-e2e

      - name: Dump wp-env logs on failure
        if: failure()
        run: |
          npx wp-env logs || true
          npx wp-env logs tests || true

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
